name: android-build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Lint + unit tests + assembleDebug
        run: |
          chmod +x gradlew
          ./gradlew lint testDebugUnitTest assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coiffuredz-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
